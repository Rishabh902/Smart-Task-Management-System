<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <!-- TOP BAR -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <h1 class="fw-bold">
                Smart Task Manager
            </h1>

            <a href="/logout" class="btn btn-danger">
                Logout
            </a>

        </div>

    
        <div class="row g-4 mb-4">

            <div class="col-md-3">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5>Total Tasks</h5>
                        <h2 id="totalTasks" class="text-primary">0</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5>Completed</h5>
                        <h2 id="completedTasks" class="text-success">0</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5>Pending</h5>
                        <h2 id="pendingTasks" class="text-warning">0</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5>Completion %</h5>
                        <h2 id="completionPercentage" class="text-info">0%</h2>
                    </div>
                </div>
            </div>

        </div>

        <!-- MAIN SECTION -->
        <div class="row g-4">

            <!-- LEFT -->
            <div class="col-lg-4">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <h3 class="mb-4">
                            Add New Task
                        </h3>

                        <form id="taskForm">

                            <div class="mb-3">
                                <input
                                    type="text"
                                    id="title"
                                    class="form-control"
                                    placeholder="Task Title"
                                    required>
                            </div>

                            <div class="mb-3">
                                <textarea
                                    id="description"
                                    class="form-control"
                                    rows="4"
                                    placeholder="Task Description"
                                    required></textarea>
                            </div>

                            <div class="mb-3">
                                <select id="priority" class="form-select">

                                    <option value="Low">
                                        Low
                                    </option>

                                    <option value="Medium">
                                        Medium
                                    </option>

                                    <option value="High">
                                        High
                                    </option>

                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                Add Task
                            </button>

                        </form>

                    </div>

                </div>

            </div>

            <!-- RIGHT -->
            <div class="col-lg-8">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <h3 class="mb-4">
                            Your Tasks
                        </h3>

                        <div class="table-responsive">

                            <table class="table table-bordered table-hover align-middle">

                                <thead class="table-dark">

                                    <tr>
                                        <th>Title</th>
                                        <th>Priority</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>

                                </thead>

                                <tbody id="taskTableBody">

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

        const taskForm = document.getElementById("taskForm");
        const taskTableBody = document.getElementById("taskTableBody");


        // LOAD TASKS
        async function loadTasks() {

            const response = await fetch("/api/tasks");

            const data = await response.json();

            taskTableBody.innerHTML = "";

            data.tasks.forEach(task => {

                taskTableBody.innerHTML += `
                
                <tr>

                    <td>${task.title}</td>

                    <td>
                        <span class="badge bg-primary">
                            ${task.priority}
                        </span>
                    </td>

                    <td>
                        <span class="badge ${task.status === 'Completed' ? 'bg-success' : 'bg-warning'}">
                            ${task.status}
                        </span>
                    </td>

                    <td>

                        <button
                            class="btn btn-success btn-sm"
                            onclick="updateTask(${task.id})">

                            Complete

                        </button>

                        <button
                            class="btn btn-danger btn-sm"
                            onclick="deleteTask(${task.id})">

                            Delete

                        </button>

                    </td>

                </tr>
                
                `;
            });
        }


        // ADD TASK
        taskForm.addEventListener("submit", async (e) => {

            e.preventDefault();

            const taskData = {

                title: document.getElementById("title").value,

                description: document.getElementById("description").value,

                priority: document.getElementById("priority").value,

                status: "Pending"
            };

            await fetch("/api/tasks", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(taskData)
            });

            taskForm.reset();

            loadTasks();
            loadAnalytics();
        });


        // UPDATE TASK
        async function updateTask(taskId) {

            await fetch(`/api/tasks/${taskId}`, {

                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    status: "Completed"
                })
            });

            loadTasks();
            loadAnalytics();
        }


        // DELETE TASK
        async function deleteTask(taskId) {

            await fetch(`/api/tasks/${taskId}`, {

                method: "DELETE"
            });

            loadTasks();
            loadAnalytics();
        }


        // LOAD ANALYTICS
        async function loadAnalytics() {

            const response = await fetch("/api/analytics");

            const data = await response.json();

            document.getElementById("totalTasks").innerText = data.total_tasks;

            document.getElementById("completedTasks").innerText = data.completed_tasks;

            document.getElementById("pendingTasks").innerText = data.pending_tasks;

            document.getElementById("completionPercentage").innerText =
                data.completion_percentage + "%";
        }


        // INITIAL LOAD
        loadTasks();
        loadAnalytics();

    </script>

</body>

</html>
