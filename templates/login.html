<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-primary bg-gradient vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow-lg border-0 rounded-4 p-4" style="width:400px;">

        <div class="card-body">

            <h2 class="text-center mb-4 fw-bold text-dark">
                Login
            </h2>

            <form method="POST">

                <div class="mb-3">

                    <input
                        type="email"
                        name="email"
                        class="form-control form-control-lg"
                        placeholder="Enter email"
                        required>

                </div>

                <div class="mb-3">

                    <input
                        type="password"
                        name="password"
                        class="form-control form-control-lg"
                        placeholder="Enter password"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-100 btn-lg">

                    Login

                </button>

            </form>

            <p class="text-center mt-4 text-secondary">

                Don't have an account?

                <a href="/register" class="text-decoration-none fw-bold">
                    Register
                </a>

            </p>

        </div>

    </div>

</body>

</html>
